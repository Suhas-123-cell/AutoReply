pluginManagement {
  def reactNativeGradlePlugin = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
    }.standardOutput.asText.get().trim()
  ).getParentFile().absolutePath
  includeBuild(reactNativeGradlePlugin)
}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'OpenReply'

include ':app'

// Separate from the pluginManagement.includeBuild above: that one only
// resolves the `plugins {}` DSL block; this plain top-level includeBuild is
// what makes Gradle substitute the buildscript-classpath `classpath(...)`
// dependency on com.facebook.react:react-native-gradle-plugin (in the root
// build.gradle) with this local build, instead of trying to fetch it from a
// remote Maven repo.
def reactNativeGradlePluginForSubstitution = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
  }.standardOutput.asText.get().trim()
).getParentFile().absolutePath
includeBuild(reactNativeGradlePluginForSubstitution)
