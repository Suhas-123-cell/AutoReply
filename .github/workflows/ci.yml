name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: TypeScript checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # prisma's own engines.node requirement is
          # "^20.19 || ^22.12 || >=24.0" — it explicitly rejects early 20.x
          # releases, which is likely why installs were failing here.
          # 22 is squarely inside Prisma's supported range and a stable LTS.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          set +e
          npm ci --loglevel verbose 2>&1 | tee /tmp/npm-ci.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error title=npm ci failed::$(tail -c 3000 /tmp/npm-ci.log | tr '\n' ' ')"
          fi
          exit "$code"

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/instrareply
          REDIS_URL: redis://localhost:6379
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-for-ci-build
          CRON_SECRET: test-secret-for-ci-cron
          MOBILE_OTP_SECRET: test-secret-for-ci-mobile-otp
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          RESEND_API_KEY: re_test
          EMAIL_FROM: "InstaReply <login@example.com>"
          META_GRAPH_API_VERSION: v25.0
          INSTAGRAM_APP_ID: test
          INSTAGRAM_APP_SECRET: test
          FACEBOOK_APP_SECRET: test
          WEBHOOK_VERIFY_TOKEN: test
          FIREBASE_SERVICE_ACCOUNT_JSON: '{"project_id":"test","client_email":"test@test.iam.gserviceaccount.com","private_key":"-----BEGIN PRIVATE KEY-----\ntest\n-----END PRIVATE KEY-----\n"}'
