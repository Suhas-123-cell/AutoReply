[package]
name = "openreply-core"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
thiserror = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "json", "uuid"] }
