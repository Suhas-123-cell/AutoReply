# Install cloudflare-real-ip.conf at /etc/nginx/cloudflare-real-ip.conf.
server {
    listen 80;
    server_name REPLACE_WITH_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name REPLACE_WITH_DOMAIN;

    ssl_certificate /etc/ssl/autoreply/origin.pem;
    ssl_certificate_key /etc/ssl/autoreply/origin.key;
    include /etc/nginx/cloudflare-real-ip.conf;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }
}
